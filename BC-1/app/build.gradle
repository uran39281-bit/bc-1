plugins { id 'com.android.application' }

android {
    namespace 'com.blackice.bc1'
    compileSdk 36
    // Auto captions: whisper.cpp built from the pinned submodule in BC-1/third_party.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.blackice.bc1'
        // Use a parallel preview install when the earlier signing key is unavailable.
        if (project.hasProperty('bc1SideBySide')) applicationIdSuffix '.preview'
        // ICE Lite test builds install beside the released app and never touch its projects.
        if (project.hasProperty('bc1IceLite')) { applicationIdSuffix '.icelite'; versionNameSuffix '-icelite' }
        manifestPlaceholders = [appLabel: project.hasProperty('bc1IceLite') ? 'BC-1 ICE Lite test' : project.hasProperty('bc1SideBySide') ? 'BC-1 v1.0.5' : 'BC-1 Dual Workspace']
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.0.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Phones (arm64) and the x86_64 emulator used by CI; other CPU types run without auto captions.
        // -Pbc1Abis=x86_64 limits a build (the emulator checks) to one CPU type.
        ndk { abiFilters.addAll(project.hasProperty('bc1Abis') ? project.property('bc1Abis').toString().split(',').toList() : ['arm64-v8a', 'x86_64']) }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_static' } }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests of project / preset encoding (android.jar only has stubs).
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
