name: Preview playback investigation
on:
  push:
    branches: ['fix/preview-playback-muxer']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before-menu
            revision: e2fbba86f15383134cc25192cf895780a289071f
          - label: current
            revision: fix/preview-playback-muxer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install build platform and generate test media
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
          if ! command -v ffmpeg >/dev/null; then sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo apt-get install -y ffmpeg; fi
          bash .github/scripts/bc1-media-fixtures.sh
      - name: Add exception logging to both revisions and prepare the same test prefix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('BC-1/app/src/main/java/com/blackice/bc1/editor/PreviewProxy.java')
          s=p.read_text().replace('fail(request,out,error.getMessage());','android.util.Log.e("BC1Preview", "Proxy muxer failure request="+request+" generation="+generation+" partial="+partial, error);fail(request,out,error.getMessage());')
          p.write_text(s)
          PY
          cat > /tmp/preview-checks.sh <<'SHELL'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p preview-diagnostics
          adb install -r BC-1/app/build/outputs/apk/debug/app-debug.apk
          adb install -r BC-1/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb logcat -c
          adb logcat -v threadtime > preview-diagnostics/logcat.txt 2>&1 &
          bc1_logcat_pid=$!
          trap 'kill "$bc1_logcat_pid" 2>/dev/null || true; wait "$bc1_logcat_pid" 2>/dev/null || true' EXIT
          classes="com.blackice.bc1.EditorWorkspaceTest,com.blackice.bc1.ExportDiagnosticsUiTest,com.blackice.bc1.FootageWorkspaceTest"
          if [ -f BC-1/app/src/androidTest/java/com/blackice/bc1/HomeBrowserTest.java ]; then classes="$classes,com.blackice.bc1.HomeBrowserTest"; fi
          classes="$classes,com.blackice.bc1.LandscapeStabilityTest,com.blackice.bc1.LayerRenderingTest,com.blackice.bc1.MobileSheetTest,com.blackice.bc1.PhoneMediaSpaceTest,com.blackice.bc1.PreviewProxyTest,com.blackice.bc1.PreviewScrubTest"
          adb shell am instrument -w -r -e class "$classes" com.blackice.bc1.preview.test/androidx.test.runner.AndroidJUnitRunner | tee preview-diagnostics/instrumentation.txt
          if grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' preview-diagnostics/instrumentation.txt; then exit 1; fi
          grep -E '^OK \([0-9]+ tests?\)' preview-diagnostics/instrumentation.txt
          SHELL
      - name: Build focused regression
        working-directory: BC-1
        run: gradle --no-daemon -Pbc1SideBySide testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash /tmp/preview-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-diagnostics-${{ matrix.label }}
          path: preview-diagnostics/
      - name: Publish diagnostic text
        if: always()
        env:
          TOKEN: ${{ github.token }}
          CASE: ${{ matrix.label }}
        run: |
          mkdir -p /tmp/preview-review
          cp preview-diagnostics/*.txt /tmp/preview-review/ 2>/dev/null || true
          printf 'Case: %s\nSource: %s\nRun: %s\n' "$CASE" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" > /tmp/preview-review/BUILD.txt
          cd /tmp/preview-review
          git init -q && git checkout -q -b diagnostics && git add .
          git -c user.name=bc1-ci -c user.email=bc1-ci@users.noreply.github.com commit -qm "Preview diagnostics $CASE"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "diagnostics:refs/heads/preview-diagnostics/${CASE}"
