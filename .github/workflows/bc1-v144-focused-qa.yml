name: Black Ice 1.4.4 focused QA
on:
  push:
    branches: ['feature/v1.4.4-*']
    paths: ['BC-1/**', '.github/workflows/bc1-v144-focused-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v144-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install media tools and fixtures
        run: |
          bash .github/scripts/bc1-install-media-tools.sh
          bash .github/scripts/bc1-media-fixtures.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/bc1-v144-focused.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Black-Ice-v144-focused-QA
          path: v144-focused-qa/
