name: Black Ice 1.5.4 native menu review
on:
  push:
    branches: [codex/v154-menu-consistency]
    paths: [BC-1/**, .github/workflows/bc1-v154-menu-check.yml]
  workflow_dispatch:
concurrency:
  group: v154-menu-review-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install test tools
        run: bash .github/scripts/bc1-install-media-tools.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/scripts/bc1-media-fixtures.sh
            cd BC-1 && gradle --no-daemon -Pbc1SideBySide assembleDebug assembleDebugAndroidTest && cd ..
            mkdir -p phone-baseline
            adb install -r BC-1/app/build/outputs/apk/debug/app-debug.apk
            adb install -r BC-1/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.blackice.bc1.InspectorControlsTest,com.blackice.bc1.MenuUpdateTest,com.blackice.bc1.DailyUpdateTest,com.blackice.bc1.MenuConsistencyTest,com.blackice.bc1.EffectStackExportTest,com.blackice.bc1.EditorWorkspaceTest,com.blackice.bc1.ExportDiagnosticsUiTest,com.blackice.bc1.PhoneMediaSpaceTest,com.blackice.bc1.engine.LivePreviewTest com.blackice.bc1.preview.test/androidx.test.runner.AndroidJUnitRunner | tee phone-baseline/tests.txt
            bash .github/scripts/bc1-collect-qa.sh phone-baseline
            if rg 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' phone-baseline/tests.txt; then exit 1; fi
            rg '^OK \([0-9]+ tests?\)' phone-baseline/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Black-Ice-v154-native-menu-review
          path: phone-baseline/
