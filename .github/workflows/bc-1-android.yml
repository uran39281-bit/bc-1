name: BC-1 Android build and GPU checks
on:
  # Builds and tests the app whenever its source, this workflow or its scripts change; never for APK-only commits.
  push:
    branches-ignore: ['qa-screenshots/**', 'test-apk/**']
    paths: ['BC-1/**', '.github/workflows/bc-1-android.yml', '.github/scripts/bc1-*.sh']
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch supersedes the running checks (and their published logs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install media test tools
        run: bash .github/scripts/bc1-install-media-tools.sh
      - name: Generate deterministic video and audio fixtures
        run: bash .github/scripts/bc1-media-fixtures.sh
      - name: Unit tests, lint, APK and GPU test APK
        working-directory: BC-1
        run: gradle --no-daemon -Pbc1SideBySide testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Black-Ice-Editor-v1.4.6-ci-candidate
          path: BC-1/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BC-1-build-reports
          path: BC-1/app/build/reports/
  gpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Write access is used only to publish reduced QA screenshots to a qa-screenshots/<branch> ref.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install media test tools
        run: bash .github/scripts/bc1-install-media-tools.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash -c 'set -o pipefail; mkdir -p BC-1/app/build/reports/androidTests; bash .github/scripts/bc1-device-checks.sh 2>&1 | tee BC-1/app/build/reports/androidTests/device-checks.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BC-1-GPU-test-reports
          path: BC-1/app/build/reports/androidTests/
      - name: Publish QA screenshots for review
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          dir=BC-1/app/build/reports/androidTests/qa
          reports=BC-1/app/build/reports/androidTests
          mkdir -p /tmp/shots
          for f in "$dir"/*.png; do [ -e "$f" ] && ffmpeg -v error -y -i "$f" -vf scale=540:-1 "/tmp/shots/$(basename "$f")" || true; done
          # Text summaries so failures can be read without downloading artifacts.
          [ -f "$reports/device-checks.log" ] && tail -c 200000 "$reports/device-checks.log" > /tmp/shots/device-checks.log || true
          [ -f "$reports/instrumentation.txt" ] && cp "$reports/instrumentation.txt" /tmp/shots/ || true
          [ -f "$reports/logcat.txt" ] && grep -E "BC1|AndroidRuntime|FATAL|MediaCodec.*(rror|xception)|CodecException|TestRunner" "$reports/logcat.txt" | tail -n 3000 > /tmp/shots/logcat-filtered.txt || true
          # Full app-process logcat for the first two failed tests (what the filter above hides).
          if [ -f "$reports/logcat.txt" ]; then
            grep -oE "TestRunner: failed: [A-Za-z0-9_]+" "$reports/logcat.txt" | head -n 2 | while read -r _ _ name; do
              awk -v n="$name" 'index($0,"started: " n "(") {on=1} on && !/TestRunner: \t|^\s+at / {print} on && index($0,"finished: " n "(") {exit}' "$reports/logcat.txt" | tail -n 4000 > "/tmp/shots/logcat-$name.txt"
            done
          fi
          ls /tmp/shots/* >/dev/null 2>&1 || exit 0
          cd /tmp/shots && git init -q && git checkout -q -b qa && git add . \
            && git -c user.name=bc1-ci -c user.email=bc1-ci@users.noreply.github.com commit -qm "QA screenshots for $GITHUB_SHA (run $GITHUB_RUN_ID)" \
            && git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "qa:refs/heads/qa-screenshots/${GITHUB_REF_NAME}"
