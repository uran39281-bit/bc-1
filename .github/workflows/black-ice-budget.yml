name: Black Ice Budget APK
on:
  push:
    branches: [budget/android-v0.1]
    paths: ['Budget/**', '.github/workflows/black-ice-budget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: node Budget/verify.cjs
      - run: gradle -p Budget assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Black-Ice-Budget-v0.1-debug
          path: Budget/build/outputs/apk/debug/*.apk
