name: Fresh unchanged wide baseline for 1.5.3
on:
  push:
    branches: [codex/v153-wide-baseline]
    paths: [.github/workflows/bc1-v153-wide-baseline.yml, .github/scripts/wide-v153-baseline.sh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install test tools
        run: |
          bc1_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo timeout 180s apt-get "${bc1_apt_options[@]}" update || true
          sudo timeout 600s apt-get "${bc1_apt_options[@]}" install -y ffmpeg ripgrep
          ffmpeg -version >/dev/null
          rg --version >/dev/null
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/wide-v153-baseline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fresh-v153-wide-baseline
          path: phone-baseline/
