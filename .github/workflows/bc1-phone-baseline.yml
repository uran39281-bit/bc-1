name: Phone update wide baseline
on:
  push:
    branches: [codex/portrait-layout-update]
    paths: [BC-1/**, .github/workflows/bc1-phone-baseline.yml]
  workflow_dispatch:
concurrency:
  group: phone-reference-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install test tools
        run: bash .github/scripts/bc1-install-media-tools.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/scripts/bc1-media-fixtures.sh
            cd BC-1 && gradle --no-daemon -Pbc1SideBySide assembleDebug assembleDebugAndroidTest && cd ..
            mkdir -p phone-baseline
            adb install -r BC-1/app/build/outputs/apk/debug/app-debug.apk
            adb install -r BC-1/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.blackice.bc1.PortraitWideBaselineTest,com.blackice.bc1.PortraitWorkspaceTest,com.blackice.bc1.EffectParamsTest#theEffectsMenuOffersTheControlsOfTheSelectedEffect,com.blackice.bc1.TimelineInteractionTest,com.blackice.bc1.WorkspaceV2Test,com.blackice.bc1.Workspace144Test#catalogIsInPlaceRestoresMediaAndSurvivesResize,com.blackice.bc1.WorkflowControlsTest,com.blackice.bc1.PhoneMediaSpaceTest,com.blackice.bc1.FootageWorkspaceTest,com.blackice.bc1.ExportDiagnosticsUiTest com.blackice.bc1.preview.test/androidx.test.runner.AndroidJUnitRunner | tee phone-baseline/tests.txt
            bash .github/scripts/bc1-collect-qa.sh phone-baseline
            if rg 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' phone-baseline/tests.txt; then exit 1; fi
            rg '^OK \([0-9]+ tests?\)' phone-baseline/tests.txt
      - name: Collect public SDK signing tools
        if: always()
        run: |
          mkdir -p android-signing-tools/lib
          tools="$ANDROID_HOME/build-tools/35.0.0"
          cp "$tools/zipalign" android-signing-tools/
          cp "$tools/lib/apksigner.jar" android-signing-tools/lib/
          cp "$tools/NOTICE.txt" "$tools/source.properties" android-signing-tools/
          if [ -d "$tools/lib64" ]; then cp -R "$tools/lib64" android-signing-tools/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-signing-tools-linux
          path: android-signing-tools/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phone-update-native-captures
          path: phone-baseline/
